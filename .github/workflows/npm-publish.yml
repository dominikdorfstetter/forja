name: Publish to npm

# Security: publishing uses npm Trusted Publishing (OIDC) + provenance.
# There is intentionally NO long-lived NPM_TOKEN — GitHub mints a short-lived
# OIDC token per run and exchanges it with npm, scoped to this repo+workflow,
# so there is no static publish credential to leak or steal.
# Each package must have a Trusted Publisher configured on npmjs.com pointing
# at this repository and the "Publish to npm" workflow.

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # required for OIDC Trusted Publishing + provenance

jobs:
  publish-analytics:
    name: "@forjacms/analytics"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/analytics
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: libs/analytics/package-lock.json

      - name: Ensure OIDC-capable npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Set version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: npm version "${REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --provenance --access public

  publish-client:
    name: "@forjacms/client"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/client
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: libs/client/package-lock.json

      - name: Ensure OIDC-capable npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Set version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: npm version "${REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --provenance --access public

  publish-sections:
    name: "@forjacms/sections"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/sections
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: libs/sections/package-lock.json

      - name: Ensure OIDC-capable npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Set version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: npm version "${REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --provenance --access public

  publish-sections-react:
    name: "@forjacms/sections-react"
    needs: publish-sections
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libs/sections-react
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure OIDC-capable npm
        run: npm install -g npm@latest

      - name: Set version from tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: npm version "${REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Publish
        run: npm publish --provenance --access public
