[package]
name = "forja"
version = "2.1.1"
edition = "2024"
authors = ["Forja Contributors"]
description = "Forja - Multi-site CMS API built with Rust Axum"
license = "AGPL-3.0-or-later"
repository = "https://github.com/dominikdorfstetter/forja"

[dependencies]
# Temp files for bounded-memory artifact building (e.g. streamed site-export ZIPs).
tempfile = "3"
# Web framework — Axum (post-Rocket cutover; see feat/migrate-to-axum branch history).
axum = { version = "0.8", features = ["json", "macros", "matched-path", "multipart", "original-uri", "query", "tokio"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "set-header", "request-id", "trace", "limit", "compression-gzip", "fs"] }

# Proc-macro sibling crate (see backend/macros/). Hosts #[derive(ValidatedDto)]
# and any future Forja-internal derives. Lives in a Cargo workspace declared
# below; the path dependency keeps the macro in lockstep with the crate.
forja-macros = { path = "macros" }
hyper = { version = "1", features = ["server"] }

# Async Runtime — bumped `signal` feature for graceful Axum shutdown
tokio = { version = "1.50.0", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal"] }

# Database
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "uuid",
    "chrono",
    "json",
    "migrate"
] }

# Serialization
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

# Date/Time
chrono = { version = "0.4.44", features = ["serde"] }

# UUID
uuid = { version = "1.23.4", features = ["v4", "v5", "serde"] }

# Validation
validator = { version = "0.20.0", features = ["derive"] }

# Environment & Config
dotenvy = "0.15.7"
config = "0.15.19"

# Logging & Tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "json"] }
tracing-error = "0.2"

# Error Handling
thiserror = "2.0.18"
anyhow = "1.0.103"

# API Documentation
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
utoipa-axum = "0.2"
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }

# Cryptographic randomness — used for crypto-random reference codes on
# form submissions (#582). OsRng (rand_core::OsRng) sources entropy from
# the OS CSPRNG; never use thread_rng() for security-sensitive tokens.
rand = "0.10"

# Security
sha2 = "0.11"
aes-gcm = "0.10"
argon2 = "0.5"
bcrypt = "0.19.0"
hmac = "0.13"
# Pinned to 9.x: jsonwebtoken 10 deserialises unknown JWT header parameters
# into a flattened `extras: HashMap<String, String>` and rejects any
# non-string value. Clerk session tokens carry an integer custom header field,
# so `decode_header` failed for every real token under 10 — 401-ing all
# authenticated requests (the 2.0.1 production outage). 9.x ignores unknown
# header fields; see the regression test in guards::auth_guard. Revisit a v10
# move only with a custom lenient header parse.
jsonwebtoken = "9"
reqwest = { version = "0.13", features = ["json", "rustls", "query", "charset", "http2"], default-features = false }

# Redis (rate limiting)
redis = { version = "1.0", features = ["tokio-comp", "connection-manager"] }

# Encoding
base64 = "0.22"
hex = "0.4"

# URL parsing
url = "2"

# Image processing (only codecs we actually encode/decode — no AVIF encoder, no rayon)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "ico"] }
infer = "0.19"
slug = "0.1"
zip = { version = "8", default-features = false, features = ["deflate"] }

# S3 storage (optional — disable default features to reduce compile time)
# `default-https-client` selects aws-smithy-http-client's `rustls-aws-lc` backend
# which pulls modern rustls 0.23 + rustls-webpki 0.103. The legacy `rustls`
# feature (used pre-cutover) brought in hyper-rustls 0.24 → rustls 0.21 →
# rustls-webpki 0.101.7 (RUSTSEC-2026-0104, DoS panic on malformed CRL).
# `rt-tokio` enables ByteStream::from_path for streamed (bounded-memory) uploads.
aws-sdk-s3 = { version = "1.125", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-config = { version = "1.8", default-features = false, features = ["default-https-client", "rt-tokio"] }

# Filesystem stats (disk usage for health checks)
nix = { version = "0.31", features = ["fs"] }

# RSS feed
rss = "2"

# Utilities
async-trait = "0.1.89"
futures = { version = "0.3.32", default-features = false, features = ["alloc"] }
lazy_static = "1.5.0"
regex = "1.12.3"
fancy-regex = "0.18.0"
subtle = "2.6.1"
altcha-lib-rs = { version = "0.3.3", default-features = false, features = ["json"] }

[features]
default = []
bundle-admin = []

[dev-dependencies]
# Testing
tokio-test = "0.4.5"
serial_test = "3.4.0"
fake = { version = "5.1.0", features = ["derive"] }
axum-test = "21"
tower = { version = "0.5", features = ["util"] }
altcha-lib-rs = { version = "0.3.3", default-features = false, features = ["json"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0

[profile.dev.package.sqlx-macros]
opt-level = 3

# Cargo workspace — hosts the sibling proc-macro crate `forja-macros`.
# The `[package]` block above is the workspace root; `cargo build` /
# `cargo test` invoked from `backend/` operate on both crates.
[workspace]
members = ["macros"]
