<!DOCTYPE html>
<html lang="{{LANG}}" dir="{{DIR}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>{{T_TITLE}}</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cpath d='M72,48H392a24,24,0,0,1,24,24V188a44,44,0,0,1,0,88V392a24,24,0,0,1-24,24H272a40,40,0,0,0-80,0H72a24,24,0,0,1-24-24V72A24,24,0,0,1,72,48Z' fill='%231e66f5'/%3E%3Ctext x='232' y='310' font-family='system-ui' font-weight='700' font-size='220' fill='%23fff' text-anchor='middle'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:linear-gradient(135deg,#f5f7fa,#e4e9f2);--card-bg:#fff;--text:#1a1a2e;--text2:#6b7280;
  --text3:#374151;--border:#e2e8f0;--input-bg:#fafbfc;--input-border:#d1d5db;
  --file-bg:#f8fafc;--meta-bg:#f1f5f9;--meta-text:#64748b;
  --badge-bg:#f0fdf4;--badge-text:#15803d;--badge-border:#bbf7d0;
  --type-bg:#dbeafe;--type-text:#1d4ed8;
  --shield-bg:linear-gradient(135deg,#e3f2fd,#bbdefb);--shield-shadow:rgba(25,118,210,.15);
  --btn-bg:linear-gradient(135deg,#1976d2,#1565c0);--btn-hover:linear-gradient(135deg,#1565c0,#0d47a1);
  --btn-shadow:rgba(25,118,210,.25);--btn-hover-shadow:rgba(25,118,210,.35);
  --err-bg:#fef2f2;--err-text:#dc2626;--err-border:#fecaca;
  --footer-text:#9ca3af;--brand-color:#1e66f5;--card-shadow:0 8px 40px rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root{
  --bg:linear-gradient(135deg,#0f172a,#1e293b);--card-bg:#1e293b;--text:#e2e8f0;--text2:#94a3b8;
  --text3:#cbd5e1;--border:#334155;--input-bg:#0f172a;--input-border:#475569;
  --file-bg:#0f172a;--meta-bg:#334155;--meta-text:#94a3b8;
  --badge-bg:#052e16;--badge-text:#4ade80;--badge-border:#166534;
  --type-bg:#1e3a5f;--type-text:#93c5fd;
  --shield-bg:linear-gradient(135deg,#1e3a5f,#1e40af);--shield-shadow:rgba(59,130,246,.2);
  --btn-bg:linear-gradient(135deg,#2563eb,#1d4ed8);--btn-hover:linear-gradient(135deg,#1d4ed8,#1e40af);
  --btn-shadow:rgba(59,130,246,.3);--btn-hover-shadow:rgba(59,130,246,.4);
  --err-bg:#450a0a;--err-text:#fca5a5;--err-border:#7f1d1d;
  --footer-text:#64748b;--brand-color:#60a5fa;--card-shadow:0 8px 40px rgba(0,0,0,.3)}}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:100vh;color:var(--text);padding:1rem}
.card{background:var(--card-bg);border-radius:20px;
  box-shadow:var(--card-shadow);padding:2.5rem;max-width:400px;width:100%;text-align:center}
.logo{width:56px;height:56px;border-radius:12px;margin-bottom:1.25rem}
h1{font-size:1.15rem;font-weight:700;margin-bottom:.25rem}
.subtitle{color:var(--text2);font-size:.85rem;margin-bottom:1.25rem}
.security-badge{display:inline-flex;align-items:center;gap:.35rem;
  background:var(--badge-bg);color:var(--badge-text);border:1px solid var(--badge-border);
  border-radius:20px;padding:.25rem .75rem;font-size:.7rem;font-weight:600;
  margin-bottom:1.5rem;letter-spacing:.02em}
.security-badge svg{width:12px;height:12px}
.file-info{background:var(--file-bg);border:1px solid var(--border);border-radius:12px;
  padding:.85rem 1rem;margin-bottom:1.5rem;text-align:left}
.file-name{font-weight:600;font-size:.88rem;word-break:break-all;margin-bottom:.4rem}
.file-meta{display:flex;gap:.4rem;align-items:center;flex-wrap:wrap}
.meta-item{font-size:.7rem;color:var(--meta-text);background:var(--meta-bg);padding:.2rem .5rem;border-radius:4px}
.type-badge{background:var(--type-bg);color:var(--type-text);font-weight:700;text-transform:uppercase}
label{display:block;font-weight:600;margin-bottom:.4rem;font-size:.82rem;text-align:left;color:var(--text3)}
input[type=password]{width:100%;padding:.7rem .85rem;border:1.5px solid var(--input-border);border-radius:10px;
  font-size:.95rem;font-family:inherit;margin-bottom:.85rem;transition:border-color .2s,box-shadow .2s;
  background:var(--input-bg);color:var(--text)}
input[type=password]:focus{outline:none;border-color:var(--brand-color);box-shadow:0 0 0 3px rgba(25,118,210,.12)}
button{width:100%;padding:.75rem;background:var(--btn-bg);color:#fff;border:none;border-radius:10px;
  font-size:.95rem;font-family:inherit;cursor:pointer;font-weight:600;
  transition:all .15s;box-shadow:0 2px 8px var(--btn-shadow)}
button:hover{background:var(--btn-hover);box-shadow:0 4px 12px var(--btn-hover-shadow);transform:translateY(-1px)}
button:active{transform:translateY(0)}
button:disabled{opacity:.5;box-shadow:none;cursor:not-allowed;transform:none}
.error{background:var(--err-bg);color:var(--err-text);padding:.7rem;border-radius:10px;margin-bottom:1rem;
  font-size:.82rem;border:1px solid var(--err-border);text-align:left}
.footer{margin-top:1.5rem;font-size:.7rem;color:var(--footer-text);display:flex;align-items:center;gap:.35rem}
.footer svg{width:12px;height:12px}
</style>
</head>
<body>
<div class="card">
<svg class="logo" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <path d="M72,48 H392 A24,24 0 0,1 416,72 V188 A44,44 0 0,1 416,276 V392 A24,24 0 0,1 392,416 H272 A40,40 0 0,0 192,416 H72 A24,24 0 0,1 48,392 V72 A24,24 0 0,1 72,48 Z" fill="#1e66f5"/>
  <text x="232" y="310" font-family="'Outfit',system-ui,sans-serif" font-weight="700" font-size="220" fill="#fff" text-anchor="middle">F</text>
</svg>
<h1>{{T_HEADING}}</h1>
<p class="subtitle">{{T_SUBTITLE}}</p>
<div class="security-badge">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
{{T_BADGE_ENCRYPTED}}
</div>
<div class="file-info">
  <div class="file-name">{{NAME}}</div>
  <div class="file-meta">{{DOC_TYPE}}{{FILE_SIZE}}</div>
</div>
{{ERROR}}
<form id="pw-form">
<label for="password">{{T_PASSWORD_LABEL}}</label>
<input type="password" id="password" name="password" required autofocus
       placeholder="{{T_PASSWORD_PLACEHOLDER}}">
<button type="submit">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;vertical-align:middle;margin-right:6px;margin-top:-2px"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>{{T_SUBMIT_BUTTON}}</button>
</form>
</div>
<div class="footer">
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
{{T_FOOTER}}
</div>
<script nonce="{{NONCE}}">
(function(){
  var I18N = {
    verifying: {{T_VERIFYING_JSON}},
    downloaded: {{T_DOWNLOADED_JSON}},
    incorrectPassword: {{T_INCORRECT_PASSWORD_JSON}},
    expired: {{T_EXPIRED_JSON}},
    locked: {{T_LOCKED_JSON}},
    submitButton: {{T_SUBMIT_BUTTON_JSON}}
  };
  document.getElementById("pw-form").addEventListener("submit",async function(e){
    e.preventDefault();
    var pw=document.getElementById("password").value;
    var btn=e.target.querySelector("button");
    btn.textContent=I18N.verifying;btn.disabled=true;
    try{
      var r=await fetch("/api/v1/documents/{{ID}}/verify-access",{
        method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({password:pw})
      });
      if(!r.ok){
        var err=await r.json().catch(function(){return {};});
        var msg = I18N.incorrectPassword;
        if(err.code === "DOCUMENT_EXPIRED") msg = I18N.expired;
        else if(err.code === "DOCUMENT_LOCKED") msg = I18N.locked;
        else if(err.detail) msg = err.detail;
        throw new Error(msg);
      }
      var data=await r.json();
      var url="/api/v1/documents/{{ID}}/download?token="+encodeURIComponent(data.token);
      var a=document.createElement("a");a.href=url;a.download="";
      document.body.appendChild(a);a.click();document.body.removeChild(a);
      btn.textContent=I18N.downloaded;
      btn.style.background="var(--badge-bg)";btn.style.color="var(--badge-text)";
      btn.style.boxShadow="none";
      setTimeout(function(){btn.textContent=I18N.submitButton;btn.disabled=false;btn.style.background="";btn.style.color="";btn.style.boxShadow="";},2000);
    }catch(err){
      var el=document.querySelector(".error");
      if(!el){el=document.createElement("div");el.className="error";
        document.querySelector("form").before(el);}
      el.textContent=err.message;
      btn.textContent=I18N.submitButton;btn.disabled=false;
    }
  });
})();
</script>
</body>
</html>
